[project]
name = "body-battery"
version = "0.1.0"
description = "Score d'énergie physiologique (Body Battery) à partir d'intervalles RR et d'accéléromètre"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["body_battery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
