<button aria-label="Retour" style="position: absolute; top: 16px; left: 16px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: #FBF8FF; color: #1B1B21; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.2);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>

<div style="position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 10px;">
<button aria-label="Type de carte : Plan" style="width: 48px; height: 48px; border: 0; border-radius: 16px; background: #FBF8FF; color: #1B1B21; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.2);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"></path></svg></button>
<button onClick="{{recenter}}" aria-label="Revenir à la dernière activité" style="width: 48px; height: 48px; border: 0; border-radius: 16px; background: #FBF8FF; color: #1B1B21; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.2);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.5" fill="currentColor"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column;">
<span style="align-self: flex-start; margin: 0 0 8px 12px; padding: 1px 5px; border-radius: 6px; background: rgba(251,248,255,.8); font-size: 9px; color: #46464F;">© OpenStreetMap</span>
<section aria-label="Carrés explorés" style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 28px 28px 0 0; background: #FBF8FF;">
<div style="display: flex; align-items: baseline; justify-content: space-between;">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #1B1B21;">Carrés explorés</h1>
<sc-if value="{{hasRoutes}}" hint-placeholder-val="{{true}}">
<span style="font-size: 13px; color: #46464F;">47 tracés GPS</span>
</sc-if>
</div>
<sc-if value="{{hasRoutes}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 26px; font-weight: 700; color: #4355B9;">1 284</span><span style="font-size: 13px; color: #46464F;">carrés de 200 m</span></p>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #46464F;">Aucun tracé GPS pour l'instant. Lancez une activité avec le GPS : chaque carré de 200 m traversé se colorera ici.</p>
</sc-if>
</section>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vue":{"editor":"enum","options":["proche","large"],"default":"proche"},"vide":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: props.vide ? 'vide' : (props.vue || 'proche') };
  }
  // Carrés traversés par des lignes brisées, sur une grille de [size] px (un point tous les demi-carrés).
  raster(lines, size) {
    const seen = {};
    lines.forEach((line) => {
      for (let i = 1; i < line.length; i++) {
        const a = line[i - 1];
        const b = line[i];
        const steps = Math.max(1, Math.ceil(Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) / size * 2));
        for (let s = 0; s <= steps; s++) {
          const x = Math.floor((a[0] + (b[0] - a[0]) * s / steps) / size);
          const y = Math.floor((a[1] + (b[1] - a[1]) * s / steps) / size);
          seen[x + ',' + y] = [x, y];
        }
      }
    });
    return Object.keys(seen).map((k) => seen[k]);
  }
  squares(cells, size, gap) {
    const side = size - gap;
    return cells.map((c) => 'M' + (c[0] * size + gap / 2) + ' ' + (c[1] * size + gap / 2) + 'h' + side + 'v' + side + 'h-' + side + 'z').join('');
  }
  lines(list) {
    return list.map((line) => 'M' + line.map((p) => p[0] + ' ' + p[1]).join('L')).join('');
  }
  renderVals() {
    const empty = !!this.props.vide;
    const view = this.state.view;
    let cells = '';
    let roads = '';
    if (view === 'proche') {
      const runs = [
        [[60, 520], [90, 430], [120, 340], [180, 280], [260, 270], [310, 320], [300, 420], [240, 500], [150, 540], [60, 520]],
        [[0, 610], [80, 585], [170, 575], [250, 560], [330, 530], [390, 505]],
        [[180, 280], [190, 200], [230, 130], [300, 90], [390, 70]],
        [[120, 340], [60, 300], [20, 220], [40, 140], [110, 110], [190, 200]],
        [[150, 540], [170, 575]], [[240, 500], [250, 560]], [[200, 400], [260, 270]], [[90, 430], [200, 400], [300, 420]]
      ];
      const other = [[[0, 160], [390, 200]], [[330, 0], [340, 520]], [[0, 470], [60, 520]], [[310, 320], [390, 300]], [[40, 140], [30, 0]], [[110, 110], [130, 0]]];
      cells = this.squares(this.raster(runs, 16), 16, 1);
      roads = this.lines(runs.concat(other));
    } else if (view === 'large') {
      const rides = [
        [[200, 380], [150, 300], [110, 210], [90, 120], [130, 60]],
        [[200, 380], [270, 330], [330, 250], [370, 160]],
        [[200, 380], [230, 470], [210, 560], [160, 620]],
        [[200, 380], [120, 420], [40, 440]],
        [[270, 330], [300, 400], [230, 470]]
      ];
      // Vus de loin, les carrés de 200 m font 3 px : la ville forme une tache, les sorties des traits.
      const town = [];
      for (let x = 58; x <= 76; x++) for (let y = 118; y <= 136; y++) {
        const d = (x - 67) * (x - 67) + (y - 127) * (y - 127);
        if (d < 70 && (x * 7 + y * 13) % 5 !== 0) town.push([[x * 3 + 1, y * 3 + 1], [x * 3 + 1, y * 3 + 1]]);
      }
      cells = this.squares(this.raster(rides.concat(town), 3), 3, 0);
      roads = this.lines(rides);
    }
    return {
      isVille: view === 'proche', isRegion: view === 'large', isFrance: view === 'vide',
      cells: cells, roads: roads, empty: empty, hasRoutes: !empty,
      recenter: () => { if (!empty) this.setState({ view: 'proche' }); }
    };
  }
}
</script>
</body>
</html>
