<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvelle activité — choix du sport</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght,ROND@6..144,25..151,1..1000,0..100&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-variation-settings:'ROND' 100}
button{font:inherit;font-variation-settings:inherit;color:inherit;cursor:pointer}
a{color:#0B5D4B}a:hover{color:#083F33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F5F1; color: #16201B; font-family: 'Google Sans Flex', system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 8px">
<a href="ActiviteLancer.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #16201B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Nouvelle activité</h1>
</header>

<main style="display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 0; flex-grow: 1">

<div role="group" aria-label="Sport" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{sports}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 104px; border: 0; border-radius: {{s.radius}}; background: {{s.bg}}; color: {{s.fg}}; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
<span style="font-size: 17px; font-weight: 700">{{s.label}}</span>
</button>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; border-radius: 28px; background: #FFFFFF">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">{{title}}</h2>
<span style="font-size: 14px; line-height: 1.4; color: #55635B">{{blurb}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="7">
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #CFE9DF; color: #0A3D31; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600">{{f}}</span>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 24px 24px 6px 6px; background: #FFFFFF">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #CFE9DF; color: #0A3D31; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.500-6-11a6 6 0 0 1 12 0c0 5.500-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">GPS du téléphone</span><span style="font-size: 13px; color: #55635B">Signal fort · précision 4 m</span></span>
<span style="font-size: 13px; font-weight: 600; color: #0B5D4B">Prêt</span>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 6px; background: #FFFFFF">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #F9E0E5; color: #63111F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">Fréquence cardiaque</span><span style="font-size: 13px; color: #55635B">Bracelet · en direct</span></span>
<span style="font-size: 13px; font-weight: 600; color: #A82C44">72 bpm</span>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 6px 6px 24px 24px; background: #FFFFFF">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #D8EDF4; color: #083A4C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-10 4 6 2-3 6 7z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">Altitude</span><span style="font-size: 13px; color: #55635B">Baromètre du téléphone, calé sur le GPS</span></span>
<span style="font-size: 13px; font-weight: 600; color: #0F5F7A">182 m</span>
</div>
</section>

</main>

<div style="padding: 12px 16px 20px">
<a href="{{target}}" style="height: 72px; border-radius: 36px; background: #0B5D4B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>Démarrer</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var cur = (this.state && this.state.sport) || 'course';
var defs = [
{ id: 'marche', label: 'Marche', filled: true, radius: '28px 8px 8px 28px', icon: 'M8.5 4a3 5 0 1 1 0 10a3 5 0 1 1 0-10zM15.5 10a3 5 0 1 1 0 10a3 5 0 1 1 0-10z' },
{ id: 'course', label: 'Course', filled: false, radius: '8px', icon: 'M17 4a2 2 0 1 1-4 0a2 2 0 1 1 4 0zM8 21l3-6 3 2v5M6 11l3-3h4l2 4 3 1M11 15l1-6' },
{ id: 'velo', label: 'Vélo', filled: false, radius: '8px 28px 28px 8px', icon: 'M9 17a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0zM22 17a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0zM5.5 17l3.5-7h6l3.5 7M9 10l3 7 3-7M13 6h3' }
];
var info = {
marche: { title: 'Marche', blurb: 'Balade ou randonnée : les pas du bracelet complètent le tracé GPS.', fields: ['Durée', 'Distance', 'Pas', 'Allure', 'Fréq. cardiaque', 'Dénivelé', 'Calories'], target: 'ActiviteEnCoursMarche.dc.html' },
course: { title: 'Course à pied', blurb: 'Un seul profil pour la route, le trail et l’ultra-trail. Tu précises le terrain à la fin de la séance.', fields: ['Durée', 'Distance', 'Allure', 'Allure moyenne', 'Zones cardiaques', 'Dénivelé + / −', 'Altitude', 'Temps au km'], target: 'ActiviteEnCours.dc.html' },
velo: { title: 'Vélo', blurb: 'La vitesse remplace l’allure, avec le dénivelé et l’altitude tout au long de la sortie.', fields: ['Durée', 'Distance', 'Vitesse', 'Vitesse moyenne', 'Zones cardiaques', 'Dénivelé + / −', 'Altitude', 'Calories'], target: 'ActiviteEnCoursVelo.dc.html' }
};
var sports = defs.map(function (d) {
var on = d.id === cur;
var fg = on ? '#FFFFFF' : '#16201B';
return {
label: d.label, icon: d.icon, radius: d.radius, on: on,
bg: on ? '#0B5D4B' : '#FFFFFF', fg: fg,
fill: d.filled ? fg : 'none', stroke: d.filled ? 'none' : fg,
pick: function () { self.setState({ sport: d.id }); }
};
});
var i = info[cur];
return { sports: sports, title: i.title, blurb: i.blurb, fields: i.fields, target: i.target };
}
}
</script>
</body>
</html>
