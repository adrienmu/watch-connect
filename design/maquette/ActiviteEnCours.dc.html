<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Activité en cours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght,ROND@6..144,25..151,1..1000,0..100&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-variation-settings:'ROND' 100}
button{font:inherit;font-variation-settings:inherit;color:inherit;cursor:pointer}
a{color:#4355B9}a:hover{color:#2A3A9E}
@keyframes halo{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FBF8FF; color: #1B1B21; font-family: 'Google Sans Flex', Roboto, system-ui, sans-serif">

<div style="position: relative; height: 280px; flex-shrink: 0; overflow: hidden; background: #ECEEE6">
<svg aria-hidden="true" width="390" height="320" viewBox="0 0 390 320" style="position: absolute; left: 0; top: -30px">
<defs><linearGradient id="trk" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F0A050"></stop><stop offset="0.5" stop-color="#9A6BC9"></stop><stop offset="1" stop-color="#2A3A9E"></stop></linearGradient></defs>
<path d="M110 60C160 30 250 30 300 70S310 210 250 222S130 232 108 186S84 86 110 60Z" fill="#D5EAD0"></path>
<path d="M-10 304C90 268 180 262 270 250S360 220 400 208" fill="none" stroke="#BCD5EE" stroke-width="20"></path>
<g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"><path d="M0 136L390 100"></path><path d="M66 0L98 320"></path><path d="M318 0L286 320"></path></g>
<path d="M44 262 C 64 236, 72 200, 94 184 S 140 168, 158 142 S 172 88, 204 74 S 256 78, 274 108 S 292 166, 316 158" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"></path>
<path d="M44 262 C 64 236, 72 200, 94 184 S 140 168, 158 142 S 172 88, 204 74 S 256 78, 274 108 S 292 166, 316 158" fill="none" stroke="url(#trk)" stroke-width="6" stroke-linecap="round"></path>
<circle cx="44" cy="262" r="7" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>
<span aria-hidden="true" style="position: absolute; left: 298px; top: 110px; width: 36px; height: 36px; border-radius: 18px; background: #4355B9; animation: halo 1800ms ease-out infinite"></span>
<span aria-hidden="true" style="position: absolute; left: 306px; top: 118px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; background: #4355B9; border: 4px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.3)"></span>

<div style="position: absolute; left: 12px; top: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; background: #FBF8FF; font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.18)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2E7D4F"></span>{{sportLabel}} · GPS 4 m</span></div>
</div>

<div style="position: relative; margin-top: -28px; flex-grow: 1; border-radius: 32px 32px 0 0; background: #FBF8FF; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: {{timeFg}}">{{timeLabel}}</span>
<span style="font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums">{{time}}</span>
</div></div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="padding: 14px 16px; border-radius: {{t.radius}}; background: {{t.bg}}; color: {{t.fg}}; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px">{{t.label}}</span>
<span style="font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums">{{t.value}} <span style="font-size: 14px; font-weight: 500">{{t.unit}}</span></span>
</div>
</sc-for>
</div>

<div role="img" aria-label="{{zAria}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 14px; font-weight: 700">{{zTitle}}</span>
<span style="font-size: 13px; color: #46464F">{{zRange}}</span>
</div>
<div style="position: relative; display: flex; gap: 3px; align-items: flex-end; height: 32px">
<sc-for list="{{zones}}" as="z" hint-placeholder-count="5">
<span style="flex: 1 1 0; height: {{z.h}}px; border-radius: 8px; background: {{z.bg}}; color: {{z.fg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: {{z.fw}}">{{z.n}}</span>
</sc-for>
<span style="position: absolute; left: {{zPos}}%; top: 0; width: 4px; height: 32px; margin-left: -2px; border-radius: 2px; background: #1B1B21; outline: 2px solid #FBF8FF"></span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #46464F; font-variant-numeric: tabular-nums">
<sc-for list="{{bounds}}" as="b" hint-placeholder-count="6">
<span>{{b}}</span>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px; border-radius: 20px; background: #F4F2FA">
<sc-for list="{{minor}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #46464F">{{m.label}}</span><span style="font-size: 16px; font-weight: 700">{{m.value}}</span></div>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; gap: 8px">
<sc-if value="{{running}}" hint-placeholder-val="{{true}}">
<button onClick="{{toggle}}" style="flex: 1 1 0; height: 72px; border: 0; border-radius: 36px; background: #4355B9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg>Pause</button>
<button aria-label="Verrouiller l'écran" style="width: 72px; height: 72px; flex-shrink: 0; border: 0; border-radius: 24px; background: #E8E7EF; color: #1B1B21; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11h8a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zM8 11V8a4 4 0 0 1 8 0v3"></path></svg></button>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
<button onClick="{{toggle}}" style="flex: 1 1 0; height: 72px; border: 0; border-radius: 36px 12px 12px 36px; background: #4355B9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>Reprendre</button>
<a href="ActiviteResume.dc.html" style="flex: 1 1 0; height: 72px; border-radius: 12px 36px 36px 12px; background: #1B1B21; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"></rect></svg>Terminer</a>
</sc-if>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sport":{"editor":"enum","options":["course","velo","marche"],"default":"course"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { extra: 0, paused: false }; }
componentDidMount() {
var self = this;
this.t = setInterval(function () { if (!self.state.paused) self.setState({ extra: self.state.extra + 1 }); }, 1000);
}
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
var self = this;
var sport = this.props.sport || 'course';
var data = {
course: { label: 'Course', base: 1794, bpm: 148,
tiles: [['Distance', '5,42', 'km'], ['Allure', '5′24″', '/km'], ['Fréq. cardiaque', '148', 'bpm'], ['Dénivelé +', '86', 'm']],
minor: [['Allure moy.', '5′31″ /km'], ['Altitude', '214 m'], ['Dernier km', '5′18″']] },
velo: { label: 'Vélo', base: 3552, bpm: 128,
tiles: [['Distance', '24,8', 'km'], ['Vitesse', '27,4', 'km/h'], ['Fréq. cardiaque', '128', 'bpm'], ['Dénivelé +', '312', 'm']],
minor: [['Vitesse moy.', '25,1 km/h'], ['Altitude', '348 m'], ['Calories', '612 kcal']] },
marche: { label: 'Marche', base: 1512, bpm: 104,
tiles: [['Distance', '2,16', 'km'], ['Pas', '2 840', ''], ['Fréq. cardiaque', '104', 'bpm'], ['Allure', '11′40″', '/km']],
minor: [['Calories', '142 kcal'], ['Altitude', '182 m'], ['Dénivelé +', '18 m']] }
};
var d = data[sport] || data.course;
var skins = [
{ bg: '#DEE0FF', fg: '#00105C', radius: '28px 28px 8px 28px' },
{ bg: '#E8E7EF', fg: '#1B1B21', radius: '28px 28px 28px 8px' },
{ bg: '#FFDCBE', fg: '#2C1600', radius: '28px 8px 28px 28px' },
{ bg: '#E0E0F9', fg: '#191A2C', radius: '8px 28px 28px 28px' }
];
var s = d.base + this.state.extra;
var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var paused = this.state.paused;
var bounds = [95, 114, 133, 152, 171, 190];
var zBg = ['#FFE8D4', '#FFC48A', '#F08A4B', '#C4502A', '#8C1D18'];
var zFg = ['#2C1600', '#2C1600', '#2C1600', '#FFFFFF', '#FFFFFF'];
var zNames = ['Très facile', 'Facile', 'Soutenu', 'Dur', 'Maximal'];
var zi = 0;
for (var k = 0; k < 5; k++) { if (d.bpm >= bounds[k]) zi = k; }
return {
sportLabel: d.label,
zTitle: 'Zone ' + (zi + 1) + ' · ' + zNames[zi],
zRange: bounds[zi] + ' – ' + bounds[zi + 1] + ' bpm',
zAria: 'Zones cardiaques : ' + d.bpm + ' bpm, zone ' + (zi + 1) + ' sur 5, de ' + bounds[zi] + ' à ' + bounds[zi + 1] + ' bpm',
zPos: Math.max(0, Math.min(100, (d.bpm - 95) / 95 * 100)).toFixed(1),
zones: zBg.map(function (bg, i) { return { n: i + 1, bg: bg, fg: zFg[i], h: i === zi ? 32 : 22, fw: i === zi ? 800 : 600 }; }),
bounds: bounds,
time: h ? h + ':' + pad(m) + ':' + pad(sec) : pad(m) + ':' + pad(sec),
timeLabel: paused ? 'En pause' : 'Durée',
timeFg: paused ? '#8B5000' : '#46464F',
tiles: d.tiles.map(function (t, i) { return { label: t[0], value: t[1], unit: t[2], bg: skins[i].bg, fg: skins[i].fg, radius: skins[i].radius }; }),
minor: d.minor.map(function (x) { return { label: x[0], value: x[1] }; }),
running: !paused,
paused: paused,
toggle: function () { self.setState({ paused: !paused }); }
};
}
}
</script>
</body>
</html>
